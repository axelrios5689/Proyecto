<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tienda - Agregar al Carrito</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; max-width: 450px; }
        .producto-card { border: 1px solid #ccc; padding: 20px; border-radius: 5px; }
        .form-group { margin-bottom: 15px; margin-top: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold;}
        select, input { width: 100%; padding: 8px; box-sizing: border-box; margin-bottom: 10px;}
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; cursor: pointer; width: 100%;}
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px;}
        .mensaje { margin-top: 20px; padding: 10px; display: none; text-align: center; }
        .exito { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb;}
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;}
    </style>
</head>
<body>

    <div class="header">
        <h2>Mi Tienda</h2>
        <div>🛒 Carrito: <strong id="carritoTotal">0</strong></div>
    </div>

    <div class="producto-card">
        <div class="form-group">
            <label for="producto">Seleccione un producto:</label>
            <select id="producto" onchange="actualizarPantalla()">
                <option value="0">Audífonos Inalámbricos</option>
                <option value="1">Teclado Mecánico</option>
                <option value="2">Ratón Gaming</option>
                <option value="3">Monitor 24"</option>
            </select>
        </div>

        <p>Disponibles: <strong id="stock">10</strong> unidades</p>
        
        <div class="form-group">
            <label for="cantidad">Cantidad a comprar:</label>
            <input type="number" id="cantidad" value="1" min="1">
        </div>
        
        <button type="button" id="btnAgregar" onclick="agregarAlCarrito()">Agregar al carrito</button>
    </div>

    <div id="mensajeBox" class="mensaje"></div>

    <script>
        // Arreglo con 4 productos y diferentes existencias iniciales
        const inventario = [
            { nombre: "Audífonos Inalámbricos", stock: 10 },
            { nombre: "Teclado Mecánico", stock: 5 },
            { nombre: "Ratón Gaming", stock: 8 },
            { nombre: "Monitor 24\"", stock: 3 }
        ];
        
        let totalEnCarrito = 0;

        // Actualiza el texto de disponibilidad cuando se elige otro producto en la lista
        function actualizarPantalla() {
            const indice = document.getElementById('producto').value;
            document.getElementById('stock').innerText = inventario[indice].stock;
            document.getElementById('cantidad').value = 1; // Reinicia la cantidad a 1
            document.getElementById('mensajeBox').style.display = 'none'; // Oculta mensajes previos
        }

        function agregarAlCarrito() {
            const indice = document.getElementById('producto').value;
            const inputCantidad = document.getElementById('cantidad').value;
            const cantidad = parseInt(inputCantidad);
            const msgBox = document.getElementById('mensajeBox');
            const carritoTotal = document.getElementById('carritoTotal');
            const productoSeleccionado = inventario[indice];
            
            msgBox.style.display = 'block';

            if (isNaN(cantidad) || cantidad <= 0) {
                mostrarMensaje("Error: La cantidad debe ser un número entero mayor que cero.", "error");
            } else if (cantidad > productoSeleccionado.stock) {
                mostrarMensaje("Error: No hay inventario suficiente. Máximo disponible: " + productoSeleccionado.stock, "error");
            } else {
                // Descuenta la cantidad comprada del inventario del producto
                productoSeleccionado.stock -= cantidad;
                totalEnCarrito += cantidad;
                
                // Actualiza visualmente el carrito y las piezas restantes
                carritoTotal.innerText = totalEnCarrito;
                document.getElementById('stock').innerText = productoSeleccionado.stock;
                
                mostrarMensaje("Éxito: Se agregaron " + cantidad + " '" + productoSeleccionado.nombre + "' al carrito.", "exito");
            }
        }

        function mostrarMensaje(texto, tipo) {
            const msgBox = document.getElementById('mensajeBox');
            msgBox.className = 'mensaje ' + tipo;
            msgBox.innerText = texto;
        }
        
        // Carga la información del primer producto al abrir la página
        actualizarPantalla();
    </script>
</body>
</html>
