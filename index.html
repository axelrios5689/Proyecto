<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Estudiantes</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; max-width: 400px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #007BFF; color: white; border: none; cursor: pointer;}
        .mensaje { margin-top: 20px; padding: 10px; display: none; }
        .exito { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb;}
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;}
    </style>
</head>
<body>

    <h2>Registro Universitario</h2>
    <div id="mensajeBox" class="mensaje"></div>

    <form id="registroForm">
        <div class="form-group">
            <label for="nombre">Nombre (3-50 caracteres):</label>
            <input type="text" id="nombre" name="nombre">
        </div>
        <div class="form-group">
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo">
        </div>
        <div class="form-group">
            <label for="edad">Edad (18-65):</label>
            <input type="number" id="edad" name="edad">
        </div>
        <div class="form-group">
            <label for="password">Contraseña (Mínimo 8 caracteres):</label>
            <input type="password" id="password" name="password">
        </div>
        <button type="button" id="btnRegistrar" onclick="validarFormulario()">Registrar</button>
    </form>

    <script>
        function validarFormulario() {
            const nombre = document.getElementById('nombre').value.trim();
            const correo = document.getElementById('correo').value.trim();
            const edad = parseInt(document.getElementById('edad').value);
            const password = document.getElementById('password').value;
            const msgBox = document.getElementById('mensajeBox');
            
            msgBox.style.display = 'block';
            msgBox.className = 'mensaje error'; // Por defecto es error

            // Validaciones
            if (nombre.length < 3 || nombre.length > 50) {
                msgBox.innerText = "Error: El nombre debe tener entre 3 y 50 caracteres.";
                return;
            }
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(correo)) {
                msgBox.innerText = "Error: El formato del correo es inválido.";
                return;
            }
            if (isNaN(edad) || edad < 18 || edad > 65) {
                msgBox.innerText = "Error: La edad debe ser un número entre 18 y 65.";
                return;
            }
            if (password.length < 8) {
                msgBox.innerText = "Error: La contraseña debe tener al menos 8 caracteres.";
                return;
            }

            // Si todo es correcto
            msgBox.className = 'mensaje exito';
            msgBox.innerText = "Registro exitoso";
        }
    </script>
</body>
</html>
